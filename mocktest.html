<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mock Test — NEET-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #ececec; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .header { padding: 14px 24px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; background: #0d0d0d; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 15px; font-weight: 700; color: #fff; }
    .header-title span { color: #4f8ef7; }
    .timer { font-size: 20px; font-weight: 700; color: #4f8ef7; font-variant-numeric: tabular-nums; background: #4f8ef710; padding: 6px 16px; border-radius: 8px; border: 1px solid #4f8ef730; }
    .timer.warning { color: #f97316; background: #f9731610; border-color: #f9731630; }
    .timer.danger { color: #ef4444; background: #ef444410; border-color: #ef444430; }
    .submit-btn { background: #4f8ef7; border: none; color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .submit-btn:hover { background: #3b7de8; }

    .body { display: flex; flex: 1; overflow: hidden; }

    .question-area { flex: 1; overflow-y: auto; padding: 32px; }
    .question-area::-webkit-scrollbar { width: 4px; }
    .question-area::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .question-meta { font-size: 12px; color: #4f8ef7; margin-bottom: 8px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .question-number { font-size: 13px; color: #666; margin-bottom: 12px; }

    /* Report-a-question: subtle flag icon, low visibility until hovered, and its popup */
    .difficulty-badge { display: inline-block; padding: 1.5px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 500; letter-spacing: 0; line-height: 1.5; }
    .report-flag-btn { background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; opacity: 0.35; padding: 2px 4px; margin-left: auto; transition: opacity 0.15s, transform 0.15s; }
    .report-flag-btn:hover, .report-flag-btn:focus-visible { opacity: 1; transform: scale(1.15); }
    .report-popup { position: fixed; z-index: 2000; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 12px; width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); font-size: 12px; }
    .report-popup-title { font-weight: 600; margin-bottom: 8px; color: #ececec; }
    .report-reason-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; color: #ccc; cursor: pointer; font-size: 12px; }
    .report-reason-row input { cursor: pointer; }
    .report-note { width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 6px; padding: 6px 8px; color: #ececec; font-size: 12px; font-family: 'Inter', sans-serif; margin: 6px 0; resize: vertical; }
    .report-popup-error { color: #ef4444; font-size: 11px; min-height: 14px; margin: 4px 0; }
    .report-popup-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .report-cancel-btn { background: transparent; border: 1px solid #2a2a2a; color: #888; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif; }
    .report-submit-btn { background: #ef4444; border: none; color: white; padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .report-submit-btn:hover { background: #dc2626; }
    .report-submit-btn:disabled { opacity: 0.6; cursor: default; }
    .report-popup-thanks { text-align: center; padding: 8px 4px; color: #4ade80; font-weight: 600; }
    .confirm-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; align-items: center; justify-content: center; }
    .confirm-modal { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 24px; width: 340px; max-width: calc(100vw - 32px); box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
    .confirm-modal-message { font-size: 14px; color: #ececec; line-height: 1.6; white-space: pre-line; margin-bottom: 20px; }
    .confirm-modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .confirm-modal-cancel { background: transparent; border: 1px solid #2a2a2a; color: #999; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .confirm-modal-cancel:hover { border-color: #3a3a3a; color: #ccc; }
    .confirm-modal-ok { background: #4f8ef7; border: none; color: white; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .confirm-modal-ok:hover { background: #3f7ee0; }
    body.light-mode .confirm-modal { background: #ffffff !important; border-color: #e3e3ea !important; }
    body.light-mode .confirm-modal-message { color: #16161d !important; }
    body.light-mode .confirm-modal-cancel { border-color: #d5d5dd !important; color: #55555f !important; }
    body.light-mode .report-popup { background: #ffffff !important; border-color: #e3e3ea !important; box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important; }
    body.light-mode .report-popup-title { color: #0d0d0d !important; }
    body.light-mode .report-reason-row { color: #33333d !important; }
    body.light-mode .report-note { background: #f7f7fa !important; border-color: #e3e3ea !important; color: #0d0d0d !important; }
    body.light-mode .report-cancel-btn { border-color: #e3e3ea !important; color: #7a7a85 !important; }
    .question-text { font-size: 16px; color: #ececec; line-height: 1.7; margin-bottom: 28px; font-weight: 500; }
    .match-list-preamble { margin-bottom: 8px; }
    .match-list-cols { display: flex; gap: 16px; margin: 8px 0; flex-wrap: wrap; }
    .match-list-col { flex: 1; min-width: 140px; }
    .match-list-item { padding: 3px 0; }
    .match-list-trailer { margin-top: 8px; }
    /* Assertion-Reason / Statement I-II -- each part on its own line instead of one paragraph. */
    .ar-intro { margin-bottom: 8px; }
    .ar-part { margin-bottom: 6px; }
    .ar-trailer { margin-top: 8px; }
    /* Sequential steps ((i)/(ii)/(iii)... or (a)/(b)/(c)... or (1)/(2)/(3)...) -- one item per line. */
    .seq-list-preamble { margin-bottom: 8px; }
    .seq-list-items { margin: 8px 0; }
    .seq-list-item { padding: 3px 0; }

    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .option { padding: 14px 18px; border-radius: 10px; border: 1px solid #2a2a2a; background: #111; cursor: pointer; font-size: 14px; color: #ccc; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
    .option:hover { border-color: #4f8ef750; background: #4f8ef710; color: #ececec; }
    .option.selected { border-color: #4f8ef7; background: #4f8ef720; color: #fff; }
    .option-label { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #3a3a3a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .option.selected .option-label { background: #4f8ef7; border-color: #4f8ef7; color: white; }

    .question-actions { display: flex; gap: 10px; }
    .mark-btn { background: transparent; border: 1px solid #f97316; color: #f97316; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .mark-btn:hover { background: #f9731620; }
    .mark-btn.marked { background: #f9731620; }
    .clear-btn { background: transparent; border: 1px solid #3a3a3a; color: #888; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .clear-btn:hover { background: #1a1a1a; color: #ccc; }
    .nav-btns { display: flex; gap: 10px; margin-left: auto; }
    .prev-btn, .next-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .prev-btn:hover, .next-btn:hover { background: #222; border-color: #3a3a3a; }
    .next-btn { background: #4f8ef7; border-color: #4f8ef7; color: white; }
    .next-btn:hover { background: #3b7de8; }

    .sidebar { width: 280px; background: #111; border-left: 1px solid #1e1e1e; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #1e1e1e; }
    .sidebar-header h3 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .subject-tabs { display: flex; gap: 4px; margin-top: 10px; }
    .subject-tab { flex: 1; padding: 6px 4px; border-radius: 6px; border: 1px solid #2a2a2a; background: transparent; color: #666; font-size: 11px; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; text-align: center; }
    .subject-tab.active { background: #4f8ef720; border-color: #4f8ef7; color: #4f8ef7; }

    .question-grid { padding: 12px; overflow-y: auto; flex: 1; }
    .question-grid::-webkit-scrollbar { width: 3px; }
    .question-grid::-webkit-scrollbar-thumb { background: #2a2a2a; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .grid-btn { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1px solid #2a2a2a; background: #1a1a1a; color: #666; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .grid-btn:hover { border-color: #4f8ef750; color: #ccc; }
    .grid-btn.current { border-color: #4f8ef7; background: #4f8ef720; color: #4f8ef7; }
    .grid-btn.answered { background: #4f8ef7; border-color: #4f8ef7; color: white; }
    .grid-btn.marked { background: #f9731620; border-color: #f97316; color: #f97316; }
    .grid-btn.answered.marked { background: #a855f7; border-color: #a855f7; color: white; }

    .legend { padding: 12px 16px; border-top: 1px solid #1e1e1e; display: flex; flex-wrap: wrap; gap: 8px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #666; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; }
    .loading-text { color: #666; font-size: 14px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1e1e1e; border-top-color: #4f8ef7; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stats-bar { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid #1e1e1e; background: #0d0d0d; }
    .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
    .stat-count { font-weight: 600; color: #ececec; }
    .stat-label { color: #555; }

    /* ===== LIGHT MODE ===== */
    body.light-mode { background: #f5f5f5 !important; color: #0d0d0d !important; }

    body.light-mode .header { background: #ffffff !important; border-color: #e3e3ea !important; }
    body.light-mode .header-title { color: #0d0d0d !important; }
    body.light-mode .header button[onclick="confirmExit()"] { background: #ffffff !important; border-color: #d5d5dd !important; color: #55555f !important; }
    body.light-mode #startScreen { background: #f5f5f5 !important; }
    body.light-mode #startScreen h1 { color: #0d0d0d !important; }
    body.light-mode #startScreen button[onclick*="chat.html"],
    body.light-mode #startScreen .lang-toggle { background: #ffffff !important; border-color: #d5d5dd !important; color: #55555f !important; }
    body.light-mode #startScreen h2[style*="color:#fff"],
    body.light-mode #startScreen h2[style*="color: #fff"] { color: #0d0d0d !important; }
    body.light-mode #startScreen h2[style*="color:#ef4444"] { color: #ef4444 !important; }
    body.light-mode #startScreen p[style*="color:#555"] { color: #7a7a85 !important; }
    body.light-mode #startScreen p[style*="color:#333"] { color: #9a9aa5 !important; }
    body.light-mode #startScreen div[style*="background:#1a1a1a"] { background: #e3e3ea !important; }

    body.light-mode .timer { background: #4f8ef714 !important; border-color: #4f8ef740 !important; }
    body.light-mode .timer.warning { background: #f9731614 !important; border-color: #f9731640 !important; }
    body.light-mode .timer.danger { background: #ef444414 !important; border-color: #ef444440 !important; }

    body.light-mode .question-area::-webkit-scrollbar-thumb { background: #d0d0d5 !important; }
    body.light-mode .question-number { color: #55555f !important; }
    body.light-mode .question-text { color: #0d0d0d !important; }

    body.light-mode .option { border-color: #d5d5dd !important; background: #ffffff !important; color: #333338 !important; }
    body.light-mode .option:hover { border-color: #4f8ef750 !important; background: #4f8ef70d !important; color: #0d0d0d !important; }
    body.light-mode .option.selected { border-color: #4f8ef7 !important; background: #4f8ef71a !important; color: #0d0d0d !important; }
    body.light-mode .option-label { border-color: #c8c8d2 !important; }
    body.light-mode .option.selected .option-label { background: #4f8ef7 !important; border-color: #4f8ef7 !important; color: #ffffff !important; }

    body.light-mode .mark-btn:hover { background: #f9731618 !important; }
    body.light-mode .mark-btn.marked { background: #f9731618 !important; }
    body.light-mode .clear-btn { border-color: #d5d5dd !important; color: #55555f !important; }
    body.light-mode .clear-btn:hover { background: #f0f0f3 !important; color: #0d0d0d !important; }
    body.light-mode .prev-btn, body.light-mode .next-btn { background: #ffffff !important; border-color: #d5d5dd !important; color: #333338 !important; }
    body.light-mode .prev-btn:hover, body.light-mode .next-btn:hover { background: #f0f0f3 !important; border-color: #c8c8d2 !important; }
    body.light-mode .next-btn { background: #4f8ef7 !important; border-color: #4f8ef7 !important; color: #ffffff !important; }
    body.light-mode .next-btn:hover { background: #3b7de8 !important; }

    body.light-mode .sidebar { background: #ffffff !important; border-color: #e3e3ea !important; }
    body.light-mode .sidebar-header { border-color: #e3e3ea !important; }
    body.light-mode .sidebar-header h3 { color: #55555f !important; }
    body.light-mode .subject-tab { border-color: #d5d5dd !important; color: #55555f !important; }
    body.light-mode .subject-tab:hover { border-color: #4f8ef750 !important; color: #0d0d0d !important; }
    body.light-mode .subject-tab.active { background: #4f8ef71a !important; border-color: #4f8ef7 !important; color: #4f8ef7 !important; }

    body.light-mode .question-grid::-webkit-scrollbar-thumb { background: #d0d0d5 !important; }
    body.light-mode .grid-btn { background: #f0f0f3 !important; border-color: #d5d5dd !important; color: #55555f !important; }
    body.light-mode .grid-btn:hover { border-color: #4f8ef750 !important; color: #0d0d0d !important; }
    body.light-mode .grid-btn.current { border-color: #4f8ef7 !important; background: #4f8ef71a !important; color: #4f8ef7 !important; }
    body.light-mode .grid-btn.answered { background: #4f8ef7 !important; border-color: #4f8ef7 !important; color: #ffffff !important; }
    body.light-mode .grid-btn.marked { background: #f9731618 !important; border-color: #f97316 !important; color: #f97316 !important; }
    body.light-mode .grid-btn.answered.marked { background: #a855f7 !important; border-color: #a855f7 !important; color: #ffffff !important; }

    body.light-mode .legend { border-color: #e3e3ea !important; }
    body.light-mode .legend-item { color: #55555f !important; }
    body.light-mode .legend-item .legend-dot[style*="background:#1a1a1a"] { background: #f0f0f3 !important; border-color: #d5d5dd !important; }

    body.light-mode .loading-text { color: #55555f !important; }
    body.light-mode .spinner { border-color: #e3e3ea !important; border-top-color: #4f8ef7 !important; }

    body.light-mode .stats-bar { background: #ffffff !important; border-color: #e3e3ea !important; }
    body.light-mode .stat-count { color: #0d0d0d !important; }
    body.light-mode .stat-label { color: #7a7a85 !important; }
    body.light-mode .stat-dot[style*="background:#555"] { background: #9a9aa5 !important; }
  
    /* Smooth fade-in on page load */
    body { animation: pageFadeIn 0.22s ease; }
    @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0d0d0d;display:flex;align-items:center;justify-content:center;z-index:999;">
    <div style="text-align:center;max-width:680px;padding:40px;width:100%;">
      <div style="position:fixed;top:16px;left:16px;display:flex;gap:8px;">
        <button onclick="window.location.href='./chat.html'" style="background:transparent;border:1px solid #2a2a2a;color:#888;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Inter,sans-serif;transition:all 0.2s;" onmouseover="this.style.color='#ccc'" onmouseout="this.style.color='#888'" data-i18n="common.backToNeetAi">← Back to NEET-AI</button>
        <button class="lang-toggle" onclick="toggleLang()" style="background:transparent;border:1px solid #2a2a2a;color:#888;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Inter,sans-serif;">हिं</button>
      </div>
      <h1 style="font-size:26px;font-weight:800;color:#fff;margin-bottom:36px;" data-i18n="mocktest.chooseTest">Choose Your Test</h1>
      <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;">
        <button onclick="startTest()" style="flex:1;min-width:240px;background:linear-gradient(135deg,#4f8ef7,#3b6fe0);border:none;color:white;padding:36px 24px;border-radius:18px;cursor:pointer;font-family:Inter,sans-serif;transition:all 0.2s;box-shadow:0 10px 30px rgba(79,142,247,0.3);" onmouseover="this.style.transform='translateY(-5px)';this.style.boxShadow='0 16px 40px rgba(79,142,247,0.45)';" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 10px 30px rgba(79,142,247,0.3)';">
          <div style="font-size:38px;margin-bottom:14px;">📝</div>
          <div style="font-size:20px;font-weight:800;margin-bottom:6px;" data-i18n="mocktest.fullMockTest">Full Mock Test</div>
          <div style="font-size:12.5px;opacity:0.85;font-weight:400;" data-i18n="mocktest.fullMockMeta">180 Qs · 3h 20m · Max 720 marks</div>
        </button>
        <button onclick="window.location.href='./personalised-test.html'" style="flex:1;min-width:240px;background:linear-gradient(135deg,#a855f7,#7c3aed);border:none;color:white;padding:36px 24px;border-radius:18px;cursor:pointer;font-family:Inter,sans-serif;transition:all 0.2s;box-shadow:0 10px 30px rgba(168,85,247,0.3);" onmouseover="this.style.transform='translateY(-5px)';this.style.boxShadow='0 16px 40px rgba(168,85,247,0.45)';" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 10px 30px rgba(168,85,247,0.3)';">
          <div style="font-size:38px;margin-bottom:14px;">🎯</div>
          <div style="font-size:20px;font-weight:800;margin-bottom:6px;" data-i18n="mocktest.personalisedTest">Personalised Test</div>
          <div style="font-size:12.5px;opacity:0.85;font-weight:400;" data-i18n="mocktest.personalisedMeta">Pick subject, chapter & count</div>
        </button>
      </div>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <button onclick="confirmExit()" style="background:transparent;border:1px solid #2a2a2a;color:#888;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Inter,sans-serif;margin-right:12px;" data-i18n="mocktest.exit">← Exit</button>
      <span class="header-title">NEET<span>-AI</span> Mock Test</span>
    </div>
    <div class="timer" id="timer">3:20:00</div>
    <button class="submit-btn" onclick="confirmSubmit()" data-i18n="mocktest.submitTest">Submit Test</button>
  </div>

  <div class="body">
    <div class="question-area" id="questionArea">
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading questions...</div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <h3 data-i18n="mocktest.questions">Questions</h3>
        <div class="subject-tabs">
          <button class="subject-tab active" onclick="filterSubject('all')" data-i18n="personalisedTest.all">All</button>
          <button class="subject-tab" onclick="filterSubject('Biology')">Bio</button>
          <button class="subject-tab" onclick="filterSubject('Physics')">Phy</button>
          <button class="subject-tab" onclick="filterSubject('Chemistry')">Chem</button>
        </div>
      </div>
      <div class="question-grid">
        <div class="grid" id="questionGrid"></div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4f8ef7;"></div> <span data-i18n="mocktest.answered">Answered</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316;border:1px solid #f97316;"></div> <span data-i18n="mocktest.marked">Marked</span></div>

    function renderMathInText(text, plainTransform) {

      const re = /\$\$([^$]+)\$\$|\$([^$\n]+)\$/g;
      let m;
      while ((m = re.exec(text)) !== null) {

      if (lastIndex < text.length) parts.push({ type: 'text', value: text.slice(lastIndex) });

      return parts.map(p => {

// ---------------- Match List-I / List-II formatting ----------------
// Detects "Match List-I with List-II" style questions and lays the two lists out as
// side-by-side columns instead of one long wall of text. Only kicks in when parsing is
// unambiguous (both lists found, equal item counts) -- anything less confident falls back
// to this file's normal rendering untouched, rather than risk mangling a question.
function findListMarkers_ML(text) {
  // These questions consistently mention "List I ... List II" TWICE: once in the intro
  // sentence, again as the literal column header right before the real items. Taking the
  // LAST "List I" and the first "List II" after it skips the intro and lands on the pair
  // that actually precedes the content. [-–—\s] covers plain hyphen plus en-dash/em-dash,
  // which PDF extraction frequently substitutes for a typeset dash.
  // Also matches "Column-A ... Column-B" style headers (letters, not just roman numerals) --
  // just as common in real questions as "List I ... List II".
  const re = /(list|column)\s*[-–—\s]*\b(I{1,2}|A|B)\b/gi;
  let m;
  const iPositions = [], iiPositions = [];
  while ((m = re.exec(text)) !== null) {
    const marker = m[2].toUpperCase();
    const entry = { start: m.index, end: m.index + m[0].length };
    if (marker === 'I' || marker === 'A') iPositions.push(entry); else iiPositions.push(entry);
  }
  if (iPositions.length === 0 || iiPositions.length === 0) return null;
  const lastI = iPositions[iPositions.length - 1];
  const firstIIAfter = iiPositions.find(p => p.start > lastI.start);
  if (!firstIIAfter) return null;
  return { listIStart: lastI.start, listIEnd: lastI.end, listIIEnd: firstIIAfter.end };
}

// Single unified pass rather than "split the List-I block, then the List-II block"
// separately -- some questions lay items out sequentially (all of List-I, then all of
// List-II), many interleave them row by row ("(A) M Phase (I) Proteins... (B) G2 Phase
// (II) Inactive phase..."). Finding every marker of both types in one pass and bucketing
// by which type each one was handles both layouts without needing to know which one a
// given question uses.
const MATCH_LIST_ITEM_RE = /\(\s*([a-hA-H])\s*\)|\(\s*([ivxIVX]{1,4})\s*\)|(?:^|\s)([a-hA-H]|\d{1,2})\.(?=\s|$)|(?:^|\s)([ivxIVX]{1,4})\.(?=\s|$)/g;

function findItemMarkers_ML(content) {
  const markers = [];
  let m;
  MATCH_LIST_ITEM_RE.lastIndex = 0;
  while ((m = MATCH_LIST_ITEM_RE.exec(content)) !== null) {
    const type = (m[1] !== undefined || m[3] !== undefined) ? 'A' : 'B';
    const leadingSpace = /^\s/.test(m[0]) ? 1 : 0;
    markers.push({ start: m.index + leadingSpace, type });
  }
  return markers;
}

// A few source questions repeat "List-II:" (sometimes with a bracketed annotation, e.g.
// "List-II [Stage of...]:") a second time after the real header pair -- an extraction
// duplication artifact, not real content. It doesn't match any item marker, so it silently
// glues onto whatever the last real item happened to be without this cleanup.
function stripTrailingListArtifact_ML(itemText) {
  return itemText.replace(/\s*[;,.]?\s*(list|column)\s*[-–—\s]*(I{1,2}|A|B)\s*(\[[^\]]*\])?\s*:?\s*$/i, '').trim();
}

function parseMatchList_ML(text) {
  const markers = findListMarkers_ML(text);
  if (!markers) return null;
  let content = text.slice(markers.listIEnd);
  // Cut off a trailing instruction sentence ("Choose the correct answer...") before item
  // splitting -- otherwise it glues onto whatever the last real item happens to be.
  const trailerMatch = content.match(/\b(choose|select|identify)\b/i);
  let trailer = '';
  if (trailerMatch) {
    trailer = content.slice(trailerMatch.index).trim();
    content = content.slice(0, trailerMatch.index);
  }
  const itemMarkers = findItemMarkers_ML(content);
  if (itemMarkers.length === 0) return null;
  const itemsI = [], itemsII = [];
  for (let i = 0; i < itemMarkers.length; i++) {
    const start = itemMarkers[i].start;
    const end = i + 1 < itemMarkers.length ? itemMarkers[i + 1].start : content.length;
    const itemText = stripTrailingListArtifact_ML(content.slice(start, end).trim());
    if (!itemText) continue;
    (itemMarkers[i].type === 'A' ? itemsI : itemsII).push(itemText);
  }
  // Equal counts required -- an imbalance means the parse is confused (a stray "(A)"/"(B)"
  // matched inside ordinary text, a source question genuinely missing an item, etc.), and a
  // mismatched pair of columns would be actively misleading rather than merely unhelpful.
  if (itemsI.length === 0 || itemsII.length === 0 || itemsI.length !== itemsII.length) return null;
  return { preamble: text.slice(0, markers.listIStart).trim(), itemsI, itemsII, trailer };
}

// formatFn renders one piece of text (preamble/item/trailer) using whatever this file
// already uses for question text, so Match-List columns look consistent with the rest of
// that page's own formatting. Returns null (not a fallback string) when the text isn't
// confidently a Match-List question, so callers know to run their own normal formatting.
function renderMatchListHtml_ML(text, formatFn) {
  if (!text) return null;
  const parsed = parseMatchList_ML(text);
  if (!parsed) return null;
  const colHtml = items => items.map(item => `<div class="match-list-item">${formatFn(item)}</div>`).join('');
  return (parsed.preamble ? `<div class="match-list-preamble">${formatFn(parsed.preamble)}</div>` : '')
    + `<div class="match-list-cols"><div class="match-list-col">${colHtml(parsed.itemsI)}</div><div class="match-list-col">${colHtml(parsed.itemsII)}</div></div>`
    + (parsed.trailer ? `<div class="match-list-trailer">${formatFn(parsed.trailer)}</div>` : '');
}

// ---------------- Assertion-Reason / Statement I-II formatting ----------------
// Detects "Given below are two statements: Assertion (A): ... Reason (R): ..." (or
// "Statement I: ... Statement II: ...") style questions and breaks them into separate
// lines (intro, each labelled part, trailer) instead of one dense paragraph. Falls back
// to this file's normal rendering whenever fewer than 2 distinct markers are found.
const AR_MARKER_RE = /\b(?:assertion\s*\(?\s*[a-z]?\s*\)?|reason\s*\(?\s*[a-z]?\s*\)?|statements?\s*[-\s]*(?:[ivx]{1,3}|[a-h]|\d{1,2}))\s*:/gi;

function findAssertionReasonParts_AR(text) {
  const markers = [];
  let m;
  AR_MARKER_RE.lastIndex = 0;
  while ((m = AR_MARKER_RE.exec(text)) !== null) {
    markers.push({ start: m.index, end: m.index + m[0].length, label: m[0] });
  }
  if (markers.length < 2) return null;

  // Same phenomenon as the Match-List parser's intro-vs-header problem: the intro
  // sentence itself often says "...the other is labelled as Reason (R):", which reads
  // identically to a real marker. A real question never labels two parts with the same
  // marker, so when one repeats, keep only its LAST occurrence (closest to the real
  // content) and drop the earlier one as an intro mention.
  const lastByKind = new Map();
  markers.forEach(mk => {
    const kind = mk.label.toLowerCase().replace(/[^a-z0-9]/g, '');
    lastByKind.set(kind, mk);
  });
  const dedupedMarkers = Array.from(lastByKind.values()).sort((a, b) => a.start - b.start);
  if (dedupedMarkers.length < 2) return null;

  const intro = text.slice(0, dedupedMarkers[0].start).trim();

  const afterLastMarker = text.slice(dedupedMarkers[dedupedMarkers.length - 1].end);
  // "In the light of the above statements," almost always precedes "choose/select/
  // identify" in the same sentence -- catching it here too keeps that whole sentence
  // together as the trailer instead of splitting it mid-clause.
  const trailerMatch = afterLastMarker.match(/\b(in the light of|choose|select|identify)\b/i);
  let trailer = '';
  let lastPartEnd = text.length;
  if (trailerMatch) {
    trailer = afterLastMarker.slice(trailerMatch.index).trim();
    lastPartEnd = dedupedMarkers[dedupedMarkers.length - 1].end + trailerMatch.index;
  }

  const parts = [];
  for (let i = 0; i < dedupedMarkers.length; i++) {
    const end = i + 1 < dedupedMarkers.length ? dedupedMarkers[i + 1].start : lastPartEnd;
    const partText = text.slice(dedupedMarkers[i].start, end).trim();
    if (partText) parts.push(partText);
  }
  if (parts.length < 2) return null;

  return { intro, parts, trailer };
}

function renderAssertionReasonHtml_AR(text, formatFn) {
  if (!text) return null;
  const parsed = findAssertionReasonParts_AR(text);
  if (!parsed) return null;
  const partsHtml = parsed.parts.map(p => `<div class="ar-part">${formatFn(p)}</div>`).join('');
  return (parsed.intro ? `<div class="ar-intro">${formatFn(parsed.intro)}</div>` : '')
    + partsHtml
    + (parsed.trailer ? `<div class="ar-trailer">${formatFn(parsed.trailer)}</div>` : '');
}

// ---------------- Sequential steps / ordered-list formatting ----------------
// Detects a stem that lists several (i)/(ii)/(iii)... or (a)/(b)/(c)... or (1)/(2)/(3)...
// items run together in one paragraph (e.g. "correct sequence of steps is (i) ... (ii) ...
// (iii) ...") and breaks them into one item per line, same spirit as Match-List/AR above.
// Requires markers strictly consecutive from the first one in their family (i,ii,iii,... or
// a,b,c,... or 1,2,3,...), at least 3 of them -- a single incidental "(a)" elsewhere in the
// stem (or a chemical formula like "(NH4)2SO4") shouldn't be mistaken for the start of a list.
const SEQ_ITEM_RE = /\(\s*([a-hA-H])\s*\)|\(\s*([ivxIVX]{1,4})\s*\)|\(\s*(\d{1,2})\s*\)/g;
const SEQ_ROMAN_ORDER = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii'];

function seqMarkerOrder_SEQ(raw, family) {
  if (family === 'alpha') return raw.toLowerCase().charCodeAt(0) - 97;
  if (family === 'digit') return parseInt(raw, 10) - 1;
  return SEQ_ROMAN_ORDER.indexOf(raw.toLowerCase());
}

function findSequenceMarkers_SEQ(text) {
  const all = [];
  let m;
  SEQ_ITEM_RE.lastIndex = 0;
  while ((m = SEQ_ITEM_RE.exec(text)) !== null) {
    const family = m[1] ? 'alpha' : (m[2] ? 'roman' : 'digit');
    const raw = m[1] || m[2] || m[3];
    all.push({ start: m.index, family, order: seqMarkerOrder_SEQ(raw, family) });
  }
  if (all.length < 3) return null;

  const counts = {};
  all.forEach(mk => { counts[mk.family] = (counts[mk.family] || 0) + 1; });
  const dominant = Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b);
  const chain = all.filter(mk => mk.family === dominant);

  for (let i = 0; i < chain.length; i++) {
    if (chain[i].order !== i) return null;
  }
  return chain.length >= 3 ? chain : null;
}

function parseSequenceList_SEQ(text) {
  const markers = findSequenceMarkers_SEQ(text);
  if (!markers) return null;
  const preamble = text.slice(0, markers[0].start).trim();
  const items = [];
  for (let i = 0; i < markers.length; i++) {
    const end = i + 1 < markers.length ? markers[i + 1].start : text.length;
    const itemText = text.slice(markers[i].start, end).trim();
    if (itemText) items.push(itemText);
  }
  if (items.length < 3) return null;
  // Guards against a compact answer-option like "(i) -> (ii) -> (iii)" (a scrambled/
  // identity-order ordering CHOICE, not a real list of steps) -- real steps always have
  // actual words after the marker; a bare marker/arrow chain never does. Must be EVERY
  // item, not just some -- "(a), (b), (c) Only" used to pass here because the trailing
  // "Only" on the last item alone satisfied a .some() check, wrongly exploding a one-line
  // answer combo like "(b), (c) Only" into a 3-line list. Genuine sequence questions have
  // real words after every marker, not just the last one.
  const hasRealContent = items.every(item => /[a-zA-Z]{2,}/.test(item.replace(SEQ_ITEM_RE, '')));
  return hasRealContent ? { preamble, items } : null;
}

function renderSequenceListHtml_SEQ(text, formatFn) {
  if (!text) return null;
  const parsed = parseSequenceList_SEQ(text);
  if (!parsed) return null;
  const itemsHtml = parsed.items.map(item => `<div class="seq-list-item">${formatFn(item)}</div>`).join('');
  return (parsed.preamble ? `<div class="seq-list-preamble">${formatFn(parsed.preamble)}</div>` : '')
    + `<div class="seq-list-items">${itemsHtml}</div>`;
}

const REPORT_REASONS = [

  { value: 'unclear', label: 'Question unclear / incomplete' },

function reportFlagBtnHtml(pyqId) {

}

// Difficulty badge -- computed once by DeepSeek and cached permanently in the DB, never
// recomputed. Colors picked so text stays readable directly on the pastel fill (no white text).
function difficultyBadgeHtml(difficulty) {
  const COLORS = { Easy: '52,182,115', Moderate: '201,144,47', Difficult: '217,100,90' };
  if (!difficulty || !COLORS[difficulty]) return '';
  const rgb = COLORS[difficulty];
  return `<span class="difficulty-badge" style="background:rgba(${rgb},0.14);color:rgb(${rgb});border:1px solid rgba(${rgb},0.3);">${difficulty}</span>`;
}

function metaActionsHtml(difficulty, pyqId) {
  return `<span style="margin-left:auto;display:inline-flex;align-items:center;gap:10px;">${difficultyBadgeHtml(difficulty)}${reportFlagBtnHtml(pyqId)}</span>`;
}

// The on-display trigger: called right after a batch of questions is fetched, before first
// render. Already-classified questions cost zero DeepSeek calls -- the backend only classifies
// (and caches) the ones that come back with difficulty still null.
async function ensureDifficulties(questions, table, idField = 'id') {
  const ids = [...new Set(questions.map(q => q[idField]).filter(Boolean).map(String))];
  if (!ids.length) return;
  try {
    const resp = await fetch(`${API_BASE}/classify-difficulty`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table, ids })
    });
    const data = await resp.json();
    if (data && data.difficulties) {
      questions.forEach(q => { const d = data.difficulties[q[idField]]; if (d) q.difficulty = d; });
    }
  } catch (e) {
    console.error('difficulty classify failed', e);
  }
}

function closeReportPopup() {
  const existing = document.getElementById('reportPopup');
  if (existing) existing.remove();
  document.removeEventListener('click', reportPopupOutsideClick, true);
}

function reportPopupOutsideClick(e) {
  const popup = document.getElementById('reportPopup');
  if (popup && !popup.contains(e.target)) closeReportPopup();
}

function toggleReportNote(radioEl) {
  const note = document.getElementById('reportNote');
  if (note) note.style.display = radioEl.value === 'other' ? 'block' : 'none';
}

function openReportPopup(pyqId, btnEl) {
  closeReportPopup();
  const popup = document.createElement('div');
  popup.id = 'reportPopup';
  popup.className = 'report-popup';
  popup.innerHTML = `
    <div class="report-popup-title">Report a problem</div>
    ${REPORT_REASONS.map(r => `
      <label class="report-reason-row">
        <input type="radio" name="reportReason" value="${r.value}" onchange="toggleReportNote(this)"/> ${r.label}
      </label>`).join('')}
    <textarea class="report-note" id="reportNote" placeholder="Optional note..." style="display:none;" rows="2"></textarea>
    <div class="report-popup-error" id="reportError"></div>
    <div class="report-popup-actions">
      <button type="button" class="report-cancel-btn" onclick="closeReportPopup()">Cancel</button>
      <button type="button" class="report-submit-btn" onclick="submitReport('${pyqId}', this)">Submit</button>
    </div>`;
  document.body.appendChild(popup);
  const rect = btnEl.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  let left = Math.max(8, Math.min(rect.right - popupRect.width, document.documentElement.clientWidth - popupRect.width - 8));
  let top = Math.min(rect.bottom + 6, document.documentElement.clientHeight - popupRect.height - 8);
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  document.addEventListener('click', reportPopupOutsideClick, true);
}

async function submitReport(pyqId, btnEl) {
  const popup = document.getElementById('reportPopup');
  const selected = popup.querySelector('input[name="reportReason"]:checked');
  const errEl = document.getElementById('reportError');
  if (!selected) { errEl.textContent = 'Pick a reason first.'; return; }
  errEl.textContent = '';
  const note = document.getElementById('reportNote').value.trim();
  btnEl.disabled = true;
  btnEl.textContent = 'Submitting...';
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    // Raced against the same abort signal the fetch below uses -- getSession() has no timeout
    // of its own, so a stalled token refresh here used to leave the button stuck on
    // "Submitting..." forever with no error, since nothing guarded this specific await.
    const abortPromise = new Promise((_, reject) => {
      controller.signal.addEventListener('abort', () => reject(new DOMException('Timed out', 'AbortError')));
    });
    const { data: { session } } = await Promise.race([client.auth.getSession(), abortPromise]);
    if (!session) {
      errEl.textContent = 'Please log in to report a question.';
      btnEl.disabled = false; btnEl.textContent = 'Submit';
      return;
    }
    const res = await fetch(`${API_BASE}/report-question`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pyq_id: pyqId, user_id: session.user.id, reason: selected.value, optional_note: note }),
      signal: controller.signal
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      errEl.textContent = data.detail || data.error || 'Could not submit -- try again.';
      btnEl.disabled = false; btnEl.textContent = 'Submit';
      return;
    }
    popup.innerHTML = '<div class="report-popup-thanks">✓ Reported, thank you</div>';
    setTimeout(closeReportPopup, 1600);
  } catch (e) {
    errEl.textContent = e.name === 'AbortError' ? 'Timed out -- try again.' : 'Could not reach server.';
    btnEl.disabled = false; btnEl.textContent = 'Submit';
  } finally {
    clearTimeout(timeoutId);
  }
}

function formatQuestionText(text) {
  if (!text) return '';
  const matchListHtml = renderMatchListHtml_ML(text, formatQuestionTextInner);
  if (matchListHtml !== null) return matchListHtml;
  const arHtml = renderAssertionReasonHtml_AR(text, formatQuestionTextInner);
  if (arHtml !== null) return arHtml;
  const seqHtml = renderSequenceListHtml_SEQ(text, formatQuestionTextInner);
  if (seqHtml !== null) return seqHtml;
  return formatQuestionTextInner(text);
}

function formatQuestionTextInner(text) {
  if (!text) return '';
  // Only convert real line breaks -- this used to also force a break before every (A)-(E)
  // marker regardless of the source formatting, which mangled questions that deliberately put
  // several markers on one line (e.g. "Column-A: (A) True ribs, (B) False ribs, (C) Floating
  // ribs" as a single column-header line) into an unwanted multi-line list.
  return renderMathInText(text, escaped => escaped.replace(/\n/g, '<br>'));
}

    // Render question
    function renderQuestion(index) {
      currentIndex = index;
      const q = questions[index];
      if (!q) return;

      const isMarked = marked[index];
      const selectedAnswer = answers[index];

      document.getElementById('questionArea').innerHTML = `
        <div class="question-meta"><span>${q.subject || ''} • ${q.year || ''}</span>${metaActionsHtml(q.difficulty, q.id)}</div>
        <div class="question-number">${t('mocktest','questionOf').replace('{i}', localizeNum(index + 1)).replace('{n}', localizeNum(questions.length))}</div>
       <div class="question-text">${formatQuestionText(q.question)}</div>
      ${q.diagram_url ? `<img src="${q.diagram_url}" style="max-width:100%;height:auto;display:block;border-radius:8px;margin:12px 0;border:1px solid #2a2a2a;">` : ''}
        <div class="options" id="optionsContainer">
       ${['a','b','c','d'].map(opt => (q['option_' + opt] || q['option_' + opt + '_diagram_url']) ? `
            <div class="option ${selectedAnswer === opt ? 'selected' : ''}" onclick="selectAnswer('${opt}')">
              <div class="option-label">${opt.toUpperCase()}</div>
              <div>${renderMathInText(q['option_' + opt])}</div>
              ${q['option_' + opt + '_diagram_url'] ? `<img src="${q['option_' + opt + '_diagram_url']}" style="max-width:100%;height:auto;display:block;border-radius:6px;margin-top:8px;border:1px solid #2a2a2a;">` : ''}
            </div>
          ` : '').join('')}
        </div>
        <div class="question-actions">
          <button class="mark-btn ${isMarked ? 'marked' : ''}" onclick="toggleMark()">${isMarked ? t('mocktest','marked2') : t('mocktest','markForReview')}</button>
          <button class="clear-btn" onclick="clearAnswer()">${t('mocktest','clear')}</button>
       <button class="clear-btn" id="saveBtn-${index}" style="border-color:${savedQuestions.has(index) ? '#4ade80' : '#f97316'};color:${savedQuestions.has(index) ? '#4ade80' : '#f97316'};" onclick="saveQuestionFromMock(${index})" ${savedQuestions.has(index) ? 'disabled' : ''}>${savedQuestions.has(index) ? t('mocktest','saved') : t('mocktest','save')}</button>
          <div class="nav-btns">
           <button class="prev-btn" onclick="goTo(${index - 1}, -1)" ${index === 0 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>${t('mocktest','prev')}</button>
            <button class="next-btn" onclick="goTo(${index + 1}, 1)" ${index === questions.length - 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>${t('mocktest','next')}</button>
          </div>
        </div>
      `;
      renderGrid();
      updateStats();
    }

    function selectAnswer(opt) {
      answers[currentIndex] = opt;
      renderQuestion(currentIndex);
    }

    function clearAnswer() {
      delete answers[currentIndex];
      renderQuestion(currentIndex);
    }

    function toggleMark() {
      if (marked[currentIndex]) { delete marked[currentIndex]; }
      else { marked[currentIndex] = true; }
      renderQuestion(currentIndex);
    }

    function goTo(index, direction) {
      if (index < 0 || index >= questions.length) return;
      if (currentFilter !== 'all' && direction) {
        let next = index;
        while (next >= 0 && next < questions.length) {
          if (questions[next].subject === currentFilter) break;
          next += direction;
        }
        if (next < 0 || next >= questions.length) return;
        index = next;
      }
      renderQuestion(index);
    }

    // Question grid
    function renderGrid() {
      const grid = document.getElementById('questionGrid');
      let filteredIndices = [];

      if (currentFilter === 'all') {
        filteredIndices = questions.map((_, i) => i);
      } else {
        filteredIndices = questions.map((q, i) => q.subject === currentFilter ? i : null).filter(i => i !== null);
      }

      grid.innerHTML = filteredIndices.map(i => {
        let cls = 'grid-btn';
        if (i === currentIndex) cls += ' current';
        else if (answers[i] && marked[i]) cls += ' answered marked';
        else if (answers[i]) cls += ' answered';
        else if (marked[i]) cls += ' marked';
        return `<button class="${cls}" onclick="goTo(${i})">${localizeNum(i + 1)}</button>`;
      }).join('');
    }

    function filterSubject(subject) {
      currentFilter = subject;
      document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderGrid();
    }

    function updateStats() {
      document.getElementById('answeredCount').textContent = localizeNum(Object.keys(answers).length);
      document.getElementById('markedCount').textContent = localizeNum(Object.keys(marked).length);
      document.getElementById('skippedCount').textContent = localizeNum(questions.length - Object.keys(answers).length);
    }

    // Replaces the browser's native confirm() with a modal matching the app's own theme --
    // native confirm() shows the raw page URL/hostname in its title bar and can't be styled,
    // which looks jarring against a dark exam UI. Built on demand (not static HTML) so it
    // never sits in the DOM taking up z-index/event-listener space between uses.
    function showConfirmModal(message, onConfirm, confirmLabel, cancelLabel) {
      const existing = document.getElementById('confirmModalOverlay');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'confirmModalOverlay';
      overlay.className = 'confirm-modal-overlay';
      overlay.innerHTML = `
        <div class="confirm-modal">
          <div class="confirm-modal-message"></div>
          <div class="confirm-modal-actions">
            <button type="button" class="confirm-modal-cancel"></button>
            <button type="button" class="confirm-modal-ok"></button>
          </div>
        </div>`;
      overlay.querySelector('.confirm-modal-message').textContent = message;
      overlay.querySelector('.confirm-modal-cancel').textContent = cancelLabel || 'Cancel';
      overlay.querySelector('.confirm-modal-ok').textContent = confirmLabel || 'OK';
      function close() { overlay.remove(); }
      overlay.querySelector('.confirm-modal-cancel').onclick = close;
      overlay.querySelector('.confirm-modal-ok').onclick = function() { close(); onConfirm(); };
      overlay.addEventListener('mousedown', function(e) { if (e.target === overlay) close(); });
      document.body.appendChild(overlay);
    }

    function confirmExit() {
      showConfirmModal('Are you sure you want to exit? Your progress will be lost.', function() {
        clearInterval(timerInterval);
        window.location.href = './chat.html';
      }, 'Exit');
    }
    function confirmSubmit() {
      const answered = Object.keys(answers).length;
      const skipped = questions.length - answered;
      showConfirmModal(`You have answered ${answered} questions and skipped ${skipped}.\n\nSubmit the test?`, submitTest, 'Submit');
    }

    async function submitTest() {
      clearInterval(timerInterval);
      const timeTaken = Math.floor((Date.now() - startTime) / 1000);

      let correct = 0, wrong = 0, skipped = 0;
      const results = questions.map((q, i) => {
        const userAnswer = answers[i];
        const correctAnswer = q.correct_answer ? q.correct_answer.toLowerCase() : null;
        let status = 'skipped';
        if (!userAnswer) { skipped++; status = 'skipped'; }
        else if (userAnswer === correctAnswer) { correct++; status = 'correct'; }
        else { wrong++; status = 'wrong'; }
        return { ...q, userAnswer, status };
      });

      const score = (correct * 4) - (wrong * 1);

      sessionStorage.setItem('mockTestResults', JSON.stringify({
        score, correct, wrong, skipped,
        total: questions.length,
        timeTaken,
        results,
        date: new Date().toISOString(),
        mockTestId: currentMockTestId
      }));

      await autoSaveMockMistakes(results);
      window.location.href = './mockresults.html';
    }

    async function autoSaveMockMistakes(results) {
      try {
        const { createClient } = supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: { session } } = await client.auth.getSession();
        if (!session) return;
        const wrongQuestions = results.filter(q => q.status === 'wrong');
        for (const q of wrongQuestions) {
          await client.from('saved_questions').upsert({
            user_id: session.user.id,
            question_id: q.id,
            question: q.question,
            option_a: q.option_a,
            option_b: q.option_b,
            option_c: q.option_c,
            option_d: q.option_d,
            diagram_url: q.diagram_url,
            option_a_diagram_url: q.option_a_diagram_url,
            option_b_diagram_url: q.option_b_diagram_url,
            option_c_diagram_url: q.option_c_diagram_url,
            option_d_diagram_url: q.option_d_diagram_url,
            correct_answer: q.correct_answer,
            subject: q.subject,
            chapter: q.chapter,
            year: q.year,
            source: 'Mistake Journal'
          }, { onConflict: 'user_id,question_id' });
        }
      } catch(e) {
        console.log('Mistake save error:', e);
      }
    }

    // "Full Mock Test" card's onclick. Guests (no session) and users with zero published
    // official tests go straight to the existing random flow, unchanged. Logged-in users
    // with un-taken official tests see a picker first; official tests take priority.
    async function startTest() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) { beginLoadingQuestions(null); return; }
      try {
        const res = await fetch(`${API_BASE}/mock-tests/available?user_id=${session.user.id}`);
        const data = await res.json();
        if (data.error || !data.total_published) { beginLoadingQuestions(null); return; }
        if (data.available && data.available.length > 0) { showMockTestPicker(data.available); return; }
        document.getElementById('startScreen').innerHTML = `
          <div style="text-align:center;">
            <div style="font-size:40px;margin-bottom:16px;">🎉</div>
            <p style="color:#ccc;font-size:14px;margin-bottom:24px;" data-i18n="mocktest.allOfficialTestsDone">You've completed all official mock tests — starting a practice set instead.</p>
          </div>
        `;
        applyTranslations();
        setTimeout(() => beginLoadingQuestions(null), 1500);
      } catch (e) {
        beginLoadingQuestions(null);
      }
    }

    function showMockTestPicker(tests) {
      document.getElementById('startScreen').innerHTML = `
        <div style="text-align:center;max-width:680px;padding:40px;width:100%;">
          <h1 style="font-size:24px;font-weight:800;color:#fff;margin-bottom:28px;" data-i18n="mocktest.pickOfficialTest">Pick a Mock Test</h1>
          <div style="display:flex;flex-direction:column;gap:14px;max-width:420px;margin:0 auto;">
            ${tests.map(test => `
              <button onclick="beginLoadingQuestions(${test.id})" style="background:#151515;border:1px solid #2a2a2a;color:#ececec;padding:18px 20px;border-radius:14px;cursor:pointer;font-family:Inter,sans-serif;text-align:left;transition:border-color 0.2s;" onmouseover="this.style.borderColor='#4f8ef7'" onmouseout="this.style.borderColor='#2a2a2a'">
                <div style="font-size:16px;font-weight:700;margin-bottom:4px;">${escapeHtmlMock(test.title)}</div>
                <div style="font-size:12.5px;color:#888;">${t('mocktest', 'officialTestMeta').replace('{n}', localizeNum(test.questions_extracted))}</div>
              </button>
            `).join('')}
          </div>
          <button onclick="document.getElementById('startScreen').innerHTML = ORIGINAL_START_SCREEN_HTML; applyTranslations();" style="margin-top:24px;background:transparent;border:1px solid #2a2a2a;color:#888;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Inter,sans-serif;" data-i18n="mocktest.backToChoices">← Back</button>
        </div>
      `;
      applyTranslations();
    }

    function beginLoadingQuestions(mockTestId) {
      currentMockTestId = mockTestId || null;
      document.getElementById('startScreen').innerHTML = `
        <div style="text-align:center;">
          <div style="font-size:48px;margin-bottom:24px;">⏳</div>
          <h2 style="font-size:24px;font-weight:700;color:#fff;margin-bottom:8px;">Preparing your test...</h2>
          <p style="color:#555;font-size:14px;margin-bottom:32px;">Loading 180 questions</p>
          <div style="width:200px;height:4px;background:#1a1a1a;border-radius:4px;margin:0 auto;overflow:hidden;">
            <div id="loadBar" style="height:100%;width:0%;background:#4f8ef7;border-radius:4px;transition:width 0.25s linear;"></div>
          </div>
          <p style="color:#333;font-size:12px;margin-top:16px;" id="loadingDots">Please wait</p>
        </div>
      `;
      // Asymptotic fill instead of a fixed-duration CSS transition -- the old version animated
      // to 100% on its own 2.5s clock with zero connection to whether the fetch had actually
      // finished, so it either sat frozen at "100%" for several extra real seconds on a slow
      // connection, or the screen vanished mid-fill on a fast one. This creeps toward (never
      // reaches) 92% at a rate that only slows down, and only ever jumps to the true 100% once
      // loadQuestions() actually resolves -- so the bar can never lie about being done.
      const loadBar = document.getElementById('loadBar');
      let pct = 0;
      const progressInterval = setInterval(() => {
        pct += (92 - pct) * 0.06;
        loadBar.style.width = pct.toFixed(1) + '%';
      }, 150);
      let dots = 0;
      const dotsInterval = setInterval(() => {
        dots = (dots + 1) % 4;
        const el = document.getElementById('loadingDots');
        if (el) el.textContent = 'Please wait' + '.'.repeat(dots);
      }, 500);
      loadQuestions(mockTestId).then(() => {
        clearInterval(progressInterval);
        clearInterval(dotsInterval);
        loadBar.style.width = '100%';
        setTimeout(() => {
          document.getElementById('startScreen').style.display = 'none';
        }, 400);
      });
    }
  </script>
